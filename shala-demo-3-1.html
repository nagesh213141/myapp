  *{box-sizing:border-box;}

  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);}
  .topbar{background:var(--surface2);padding:18px 20px 20px;border-bottom:2px solid var(--line);position:relative;}
  .topbar h1{font-size:20px;margin:0;font-weight:700;}
  .topbar p{margin:5px 0 0;font-size:13.5px;color:var(--muted);}
  .roletag{position:absolute;top:18px;right:20px;font-size:12px;background:var(--gold-bg);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:20px;font-weight:700;}

  .menuscroll{display:flex;overflow-x:auto;background:var(--surface);border-bottom:2px solid var(--line);white-space:nowrap;-webkit-overflow-scrolling:touch;}
  .menuscroll::-webkit-scrollbar{display:none;}
  .mitem{flex-shrink:0;padding:14px 15px;color:var(--muted);font-size:14.5px;font-weight:700;cursor:pointer;border-bottom:4px solid transparent;}

  .content{padding:16px;padding-bottom:100px;}
  .notice{background:var(--blue-bg);border:2px solid var(--blue);border-radius:10px;padding:14px;margin-bottom:16px;}
  .notice p{margin:0;font-size:15px;color:var(--white);font-weight:600;}
  .classrow{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
  .classrow::-webkit-scrollbar{display:none;}

  .stud.present{border-color:var(--green);}

window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(key);
      if(v===null) throw new Error('not found: '+key);
      return {key, value:v, shared:false};
    } else {
      const doc = await fbDb.collection('app_data').doc(key).get();
      if(!doc.exists) throw new Error('not found: '+key);
      return {key, value:doc.data().value, shared:true};
    }
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    } else {
      await fbDb.collection('app_data').doc(key).set({value:value});
      return {key, value, shared:true};
    }
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem(key);
    } else {
      await fbDb.collection('app_data').doc(key).delete();
    }
    return {key, deleted:true, shared:!!shared};
  },
  async list(prefix, shared){
    if(!shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(!prefix || k.startsWith(prefix)) keys.push(k); }
      return {keys, prefix, shared:false};
    } else {
      let q = fbDb.collection('app_data');
      const snap = await q.get();
      const keys = [];
      snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return {keys, prefix, shared:true};
    }
  }
};

function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function addMonths(dateStr,n){ const d=new Date(dateStr); d.setMonth(d.getMonth()+n); return dateKey(d); }
function addYears(dateStr,n){ const d=new Date(dateStr); d.setFullYear(d.getFullYear()+n); return dateKey(d); }
function nextDueDate(entry){ if(!entry.lastPaidDate) return null; return entry.billingCycle==='yearly' ? addYears(entry.lastPaidDate,1) : addMonths(entry.lastPaidDate,1); }
function isFeeOverdue(entry){ const nd = nextDueDate(entry); if(!nd) return true; return todayStr() > nd; }
async function updateDirectoryEntry(id,fields){ const dir = await loadDirectory(); const it = dir.find(x=>x.id===id); if(it) Object.assign(it,fields); await saveDirectory(dir); }

    if(demoMode){ demoSchools[id] = s; } else { await window.storage.set('school4-'+id, JSON.stringify(s), true); }
    const dir = await loadDirectory();
    if(!dir.find(x=>x.id===id)){ dir.push({id, name, active:true, billingCycle, lastPaidDate}); await saveDirectory(dir); }
  }
  return s;
}

function renderSchoolDirList(dir){

  el.innerHTML = dir.map(d=>{
    const overdue = isFeeOverdue(d);
    const nd = nextDueDate(d);
    return `
    <div class="adminpad" style="${overdue?'border-color:var(--red);':''}">
      ${overdue?'<div style="background:var(--red-bg);color:var(--red);font-weight:800;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px;">⚠ फी थकीत आहे — भरलेली नाही</div>':''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div><p style="margin:0;font-weight:700;font-size:16px;">${d.name}</p><p style="margin:2px 0 0;font-size:12px;color:var(--muted);">आयडी: ${d.id}</p></div>
        <div class="toggle ${d.active?'on':'off'}" data-id="${d.id}" data-active="${d.active}"><div class="knob"></div></div>
      </div>
      <div class="field" style="margin-bottom:10px;"><label>फी भरण्याचा प्रकार</label>
        <select data-cycle="${d.id}">
          <option value="monthly" ${d.billingCycle==='monthly'?'selected':''}>दरमहा (Monthly)</option>
          <option value="yearly" ${d.billingCycle==='yearly'?'selected':''}>दरवर्षी (Yearly)</option>
        </select>
      </div>
      <p style="font-size:13.5px;color:var(--muted);margin:0 0 4px;">शेवटची फी भरल्याची तारीख: <b style="color:var(--white);">${d.lastPaidDate?displayDate(d.lastPaidDate):'नोंद नाही'}</b></p>
      <p style="font-size:13.5px;color:${overdue?'var(--red)':'var(--green)'};margin:0 0 14px;font-weight:700;">पुढची फी देय तारीख: ${nd?displayDate(nd):'—'}</p>
      <div class="sheetbtns" style="margin-bottom:10px;">
        <button class="btn primary" data-paid="${d.id}">आज फी भरली म्हणून नोंदवा</button>
      </div>
      <button class="btn ghost wide" data-enter="${d.id}">ॲडमिन म्हणून या शाळेत प्रवेश करा</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.toggle').forEach(t=>{
    t.onclick = async ()=>{
      const id = t.dataset.id;
      const newActive = !(t.dataset.active === 'true');
      await updateDirectoryEntry(id, {active:newActive});
      const s = await loadSchool(id);
      if(s){ s.active = newActive; await window.storage.set('school4-'+id, JSON.stringify(s), true); }
      renderSchoolDirList(await loadDirectory());
    };
  });
  el.querySelectorAll('[data-cycle]').forEach(sel=>{
    sel.onchange = async ()=>{ await updateDirectoryEntry(sel.dataset.cycle, {billingCycle: sel.value}); renderSchoolDirList(await loadDirectory()); };
  });
  el.querySelectorAll('[data-paid]').forEach(btn=>{
    btn.onclick = async ()=>{ await updateDirectoryEntry(btn.dataset.paid, {lastPaidDate: todayStr()}); renderSchoolDirList(await loadDirectory()); };
  });
  el.querySelectorAll('[data-enter]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.enter;
      const s = await loadSchool(id);
      if(!s){ alert('शाळा सापडली नाही.'); return; }
      school = s; ensureDefaults(); todayKey = todayStr();
      session = {role:'admin', viaSuperAdmin:true};
      renderRoot();
    };
  });
}

const STUDENT_TABS = [
  {key:'myattend', label:'माझी हजेरी', always:true},
  {key:'myprogress', label:'माझी प्रगती', permKey:'myprogress'},
  {key:'myfees', label:'माझी फी', permKey:'myfees'},
  {key:'mynotice', label:'सूचना', always:true},
  {key:'myevents', label:'उपक्रम', permKey:'myevents'},
  {key:'myparentmsg', label:'शिक्षकांचा संदेश', permKey:'myparentmsg'},
  {key:'mysend', label:'संदेश पाठवा', permKey:'mysend'},
];
function visibleStudentTabs(){ return STUDENT_TABS.filter(t=> t.always || school.studentPerms[t.permKey]); }

function studentMainHTML(){
  const cls = school.classes[session.classIdx];
  const stud = cls.students.find(s=>s.id===session.studentId);
  const tabs = visibleStudentTabs();
  const menu = tabs.map((t,i)=>`<div class="mitem ${i===0?'active':''}" data-tab="${t.key}">${t.label}</div>`).join('');
  const panes = tabs.map((t,i)=>`<div class="content" id="pane-${t.key}" style="${i===0?'':'display:none;'}"></div>`).join('');
  return `
  <div class="topbar">
    <span class="roletag">विद्यार्थी</span>
    <h1>${stud.name}</h1>
    <p>${cls.name} <span class="logoutlink" id="logoutBtn">बाहेर पडा</span></p>
  </div>
  <div class="menuscroll" id="menuscroll">${menu}</div>
  ${panes.replace('id="pane-mysend"', 'id="pane-mysend-wrap"')}
  `;
}

function classSelectorHTML(){ return school.classes.map((c,i)=>`<div class="classbtn ${i===currentClassIdx?'active':''}" data-idx="${i}">${c.name}</div>`).join(''); }
function attachClassSelectors(){ document.querySelectorAll('.classbtn').forEach(b=>{ b.onclick = ()=>{ currentClassIdx=parseInt(b.dataset.idx); selectedStudentId=null; render(); }; }); }

function attach(){
  const lb = document.getElementById('logoutBtn');
  if(lb) lb.onclick = ()=>{
    if(demoReturn){ session = demoReturn; demoReturn = null; renderRoot(); return; }
    if(session.viaSuperAdmin){ session={role:null}; showSuperAdminPanel(); }
    else { session={role:null}; showRoleLanding(); }
  };
  if(document.getElementById('qsTeacherFromAdmin')){
    document.getElementById('qsTeacherFromAdmin').onclick = ()=>{ demoReturn = {...session}; demoAsTeacher(); };
  }
  if(document.getElementById('qsStudentFromAdmin')){
    document.getElementById('qsStudentFromAdmin').onclick = ()=>{ demoReturn = {...session}; demoAsStudent(); };
  }
  if(document.getElementById('qsStudentFromTeacher')){
    document.getElementById('qsStudentFromTeacher').onclick = ()=>{ demoReturn = {...session}; demoAsStudent(); };
  }

  document.querySelectorAll('.mitem').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.mitem').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      document.querySelectorAll('.content').forEach(c=> c.style.display='none');
      const pane = document.getElementById('pane-'+currentTab);
      if(pane) pane.style.display='block';
      render();
    });
  });

  if(session.role==='student'){ renderStudentTabContent(); return; }

  if(document.getElementById('monthPicker')){
    document.getElementById('monthPicker').value = todayStr().slice(0,7);
    document.getElementById('monthPicker').onchange = render;
  }
  if(document.getElementById('addHolBtn')) document.getElementById('addHolBtn').onclick = async ()=>{
    const date = document.getElementById('holDate').value;
    const name = document.getElementById('holName').value.trim();
    if(!date || !name){ alert('तारीख आणि कारण दोन्ही टाका'); return; }
    school.holidays.push({date, name});
    await saveSchool();
    document.getElementById('holDate').value=''; document.getElementById('holName').value='';
    render();
  };
  if(document.getElementById('addStudBtn')) document.getElementById('addStudBtn').onclick = async ()=>{
    const name = document.getElementById('sName').value.trim();
    const roll = document.getElementById('sRoll').value.trim();
    if(!name || !roll){ alert('नाव आणि रोल नंबर दोन्ही टाका'); return; }
    const cls = school.classes[currentClassIdx];
    cls.students.push({ id:'s'+Date.now(), name, roll, phone:document.getElementById('sPhone').value.trim(), attendance:{}, exams:[], fees:[], behavior:'', sports:'' });
    await saveSchool();
    document.getElementById('sName').value=''; document.getElementById('sRoll').value=''; document.getElementById('sPhone').value='';
    render();
  };
  if(document.getElementById('addEventBtn')) document.getElementById('addEventBtn').onclick = async ()=>{
    const name = document.getElementById('evName').value.trim();
    const date = document.getElementById('evDate').value;
    if(!name || !date){ alert('नाव आणि तारीख टाका'); return; }
    school.events.push({ id:'ev'+Date.now(), name, date, desc: document.getElementById('evDesc').value.trim() });
    await saveSchool();
    document.getElementById('evName').value=''; document.getElementById('evDate').value=''; document.getElementById('evDesc').value='';
    render();
  };
  if(document.getElementById('saveNoticeBtn')) document.getElementById('saveNoticeBtn').onclick = async ()=>{
    school.notice = { text: document.getElementById('noticeText').value.trim(), active: document.getElementById('noticeActive').checked };
    await saveSchool(); render(); alert('जतन झालं!');
  };
  if(document.getElementById('sendAbsentMsgs')) document.getElementById('sendAbsentMsgs').onclick = ()=>{
    const cls = school.classes[currentClassIdx];
    const absentees = cls.students.filter(s=> s.attendance[todayKey]===false);
    const el = document.getElementById('absentMsgList');
    if(absentees.length===0){ el.innerHTML = '<p style="font-size:14px;color:var(--muted);">आज कोणीही गैरहजर नाही.</p>'; return; }
    el.innerHTML = absentees.map(s=>{
      if(!s.phone) return `<div class="lowrow"><span>${s.name}</span><span style="color:var(--muted);">फोन नंबर नाही</span></div>`;
      const msg = encodeURIComponent(`नमस्कार, आपला पाल्य ${s.name} आज (${todayDisplay()}) शाळेत गैरहजर आहे. कृपया कारण कळवा. धन्यवाद - ${school.name}`);
      return `<div class="lowrow"><span>${s.name}</span><a href="https://wa.me/91${s.phone.replace(/\D/g,'')}?text=${msg}" target="_blank" class="btn ghost small">WhatsApp पाठवा</a></div>`;
    }).join('');
  };
  if(document.getElementById('sendPmBtn')) document.getElementById('sendPmBtn').onclick = async ()=>{
    const title = document.getElementById('pmTitle').value.trim();
    const body = document.getElementById('pmBody').value.trim();
    if(!title || !body){ alert('शीर्षक आणि मजकूर दोन्ही टाका'); return; }
    const cls = school.classes[currentClassIdx];
    if(!cls.parentMessages) cls.parentMessages = [];
    cls.parentMessages.push({ id:'pm'+Date.now(), title, body, date: todayStr() });
    await saveSchool();
    document.getElementById('pmTitle').value=''; document.getElementById('pmBody').value='';
    render();
    alert('संदेश पाठवला!');
  };
  if(document.getElementById('sendTnBtn')) document.getElementById('sendTnBtn').onclick = async ()=>{
    const title = document.getElementById('tnTitle').value.trim();
    const body = document.getElementById('tnBody').value.trim();
    if(!title || !body){ alert('शीर्षक आणि मजकूर दोन्ही टाका'); return; }
    school.teacherNotices.push({ id:'tn'+Date.now(), title, body, date: todayStr() });
    await saveSchool();
    document.getElementById('tnTitle').value=''; document.getElementById('tnBody').value='';
    render();
    alert('सूचना पाठवली!');
  };

  if(document.getElementById('addClassBtn')){
    document.getElementById('addClassBtn').onclick = async ()=>{
      const name = document.getElementById('newClassName').value.trim();
      if(!name) return;
      school.classes.push({ id:'cl'+Date.now(), name, students:[], parentMessages:[] });
      await saveSchool();
      document.getElementById('newClassName').value='';
      render(); alert('वर्ग जोडला!');
    };
    document.getElementById('saveSettingsBtn').onclick = async ()=>{
      school.name = document.getElementById('schoolNameInput').value.trim() || school.name;
      school.teacherCode = document.getElementById('teacherCodeInput').value.trim() || school.teacherCode;
      const newPass = document.getElementById('adminPassInput').value.trim();
      if(newPass) school.adminPass = newPass;
      await saveSchool();
      await updateDirectoryEntry(school.id, {name: school.name});
      document.querySelector('.topbar h1').textContent = school.name;
      document.getElementById('adminPassInput').value = '';
      alert('जतन झालं!');
    };
    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify(school,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='shala-backup-'+school.id+'.json'; a.click();
    };
    document.getElementById('importBtnTrigger').onclick = ()=> document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev){
        try{ school = JSON.parse(ev.target.result); ensureDefaults(); await saveSchool(); render(); alert('बॅकअप परत आणला!'); }
        catch(err){ alert('फाईल चुकीची आहे.'); }
      };
      reader.readAsText(file);
    };
  }
}

function render(){
  if(session.role==='student'){ renderStudentTabContent(); return; }

  if(document.getElementById('schoolNameInput')) document.getElementById('schoolNameInput').value = school.name;
  if(document.getElementById('teacherCodeInput')) document.getElementById('teacherCodeInput').value = school.teacherCode;
  ['classrow','classrow2','classrow3','classrow4','classrow5','classrow6','classrow7'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.innerHTML = classSelectorHTML();
  });
  attachClassSelectors();

  const noticeEl = document.getElementById('noticeArea');
  if(school.notice && school.notice.active && school.notice.text){ noticeEl.innerHTML = `<div class="notice"><p>📢 ${school.notice.text}</p></div>`; }
  else noticeEl.innerHTML = '';
  if(document.getElementById('noticeText')) document.getElementById('noticeText').value = school.notice ? school.notice.text : '';
  if(document.getElementById('noticeActive')) document.getElementById('noticeActive').checked = school.notice ? !!school.notice.active : false;

  renderAttendTab();
  if(currentTab==='attendHist') renderAttendHist();
  if(currentTab==='holidays') renderHolidays();
  if(currentTab==='students') renderStudentsTab();
  if(currentTab==='progress') renderProgressTab();
  if(currentTab==='fees') renderFeesTab();
  if(currentTab==='events') renderEvents();
  if(currentTab==='parentmsg') renderParentMsgList();
  if(currentTab==='studentmsg') renderStudentMsgList();
  if(currentTab==='teachernotice') renderTeacherNoticeList();
  if(currentTab==='permissions') renderPermissions();
  if(currentTab==='settings') renderClassManageList();
}

function isHoliday(dateStr){ return school.holidays.some(h=>h.date===dateStr); }
function holidayName(dateStr){ const h = school.holidays.find(h=>h.date===dateStr); return h?h.name:''; }

function renderAttendTab(){
  const cls = school.classes[currentClassIdx];
  const body = document.getElementById('attendBody');
  if(isHoliday(todayKey)){
    body.innerHTML = `<div class="notice" style="background:var(--gold-bg);border-color:var(--gold);"><p>🎉 आज सुट्टी आहे — ${holidayName(todayKey)}. हजेरी घेण्याची गरज नाही.</p></div>`;
    return;
  }
  let present=0, absent=0;
  const rows = cls.students.map(s=>{
    const isAbsent = s.attendance[todayKey]===false;
    if(isAbsent) absent++; else present++;
    const initials = s.name.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<div class="stud ${isAbsent?'absent':'present'}" data-sid="${s.id}"><div class="avatar">${initials}</div><div class="stud-info"><p class="stud-name">${s.name}</p><p class="stud-roll">रोल नं. ${s.roll}</p></div><div class="statuslbl ${isAbsent?'absent':'present'}">${isAbsent?'गैरहजर':'हजर'}</div></div>`;
  }).join('');
  body.innerHTML = `
    <div class="dateline"><span class="dt">📅 ${todayDisplay()}</span></div>
    <div class="summary"><div class="card"><p class="lbl">हजर</p><p class="val get">${present}</p></div><div class="card"><p class="lbl">गैरहजर</p><p class="val give">${absent}</p></div></div>
    <p style="font-size:13.5px;color:var(--muted);margin:0 0 14px;">फक्त गैरहजर विद्यार्थ्यावर टॅप करा — बाकी सगळे आपोआप हजर धरले जातील.</p>
    ${cls.students.length===0 ? '<div class="empty">या वर्गात अजून विद्यार्थी नाहीत.</div>' : `<div>${rows}</div>`}
  `;
  body.querySelectorAll('.stud').forEach(el=>{
    el.onclick = async ()=>{
      const s = cls.students.find(x=>x.id===el.dataset.sid);
      s.attendance[todayKey] = s.attendance[todayKey]===false ? true : false;
      await saveSchool();
      renderAttendTab();
    };
  });
}

function computeAvg(s){
  const avgs = s.exams.map(ex=>{
    const total = ex.subjects.reduce((a,b)=>a+Number(b.marks),0);
    const max = ex.subjects.reduce((a,b)=>a+Number(b.max),0);
    return max>0 ? (total/max)*100 : 0;
  });
  return avgs.length>0 ? Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length) : 0;
}

    <div class="adminpad">
      <h4>वर्तणूक व खेळातील सहभाग</h4>

      <div class="field"><label>खेळ/इतर उपक्रम नोंद</label><textarea id="sportsNote" placeholder="उदा. खो-खो स्पर्धेत सहभाग">${s.sports||''}</textarea></div>
      <button class="btn primary wide" id="saveNotesBtn">नोंद जतन करा</button>
    </div>
    <div class="adminpad">
      <h4>परीक्षा निकाल</h4>
      <button class="btn ghost wide" id="addExamBtn" style="margin-bottom:14px;">नवीन परीक्षा जोडा</button>
      ${s.exams.length===0?'<p style="color:var(--muted);font-size:14px;">अजून परीक्षा नोंदलेली नाही.</p>':''}
      ${[...s.exams].reverse().map(ex=>{
        const total = ex.subjects.reduce((a,b)=>a+Number(b.marks),0);
        const max = ex.subjects.reduce((a,b)=>a+Number(b.max),0);
        const pct = max>0?Math.round((total/max)*100):0;
        return `<div class="lowrow" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;"><span>${ex.name}</span><span class="${pct<40?'val give':'val get'}" style="font-size:15px;">${pct}%</span></div>
          <div style="font-size:12.5px;color:var(--muted);">${ex.subjects.map(sub=>sub.name+': '+sub.marks+'/'+sub.max).join(', ')}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn primary wide" id="sendProgressBtn">पालकांना प्रगती अहवाल पाठवा</button>
  `;
  document.getElementById('saveNotesBtn').onclick = async ()=>{
    s.behavior = document.getElementById('behaviorNote').value.trim();
    s.sports = document.getElementById('sportsNote').value.trim();
    await saveSchool();
    alert('नोंद जतन झाली!');
  };
  document.getElementById('addExamBtn').onclick = ()=> openExamSheet(s);
  document.getElementById('sendProgressBtn').onclick = ()=>{
    if(!s.phone){ alert('या विद्यार्थ्याचा पालकांचा फोन नंबर नोंदवलेला नाही.'); return; }
    const lastExam = s.exams[s.exams.length-1];
    let examLine = 'अजून कोणतीही परीक्षा नोंदलेली नाही.';
    if(lastExam){
      const total = lastExam.subjects.reduce((a,b)=>a+Number(b.marks),0);
      const max = lastExam.subjects.reduce((a,b)=>a+Number(b.max),0);
      const pct = max>0?Math.round((total/max)*100):0;
      examLine = lastExam.name+' मध्ये '+pct+'% गुण मिळाले.';
    }
    const msg = encodeURIComponent(`नमस्कार, ${s.name} याचा प्रगती अहवाल:\n${examLine}\nएकूण सरासरी: ${overallAvg}%\nवर्तणूक: ${s.behavior||'नोंद नाही'}\nखेळ/उपक्रम: ${s.sports||'नोंद नाही'}\n- ${school.name}`);
    window.open('https://wa.me/91'+s.phone.replace(/\D/g,'')+'?text='+msg, '_blank');
  };
}
function openExamSheet(s){
  examSubjectRows = [{name:'',marks:'',max:''}];
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>नवीन परीक्षा जोडा — ${s.name}</h3>
    <div class="field"><label>परीक्षेचं नाव</label><input type="text" id="examName" placeholder="उदा. सहामाही परीक्षा"></div>
    <div id="subjRows"></div>
    <button class="btn ghost wide" id="addSubjRow" style="margin-bottom:14px;">आणखी विषय जोडा</button>
    <div class="sheetbtns"><button class="btn ghost" id="cancelExam">रद्द करा</button><button class="btn primary" id="saveExam">जतन करा</button></div>
  </div>`;
  document.body.appendChild(overlay);
  function renderSubjRows(){
    document.getElementById('subjRows').innerHTML = examSubjectRows.map((r,i)=>`
      <div class="subjrow">
        <input type="text" placeholder="विषय" value="${r.name}" data-i="${i}" data-f="name">
        <input type="number" placeholder="मिळालेले गुण" value="${r.marks}" data-i="${i}" data-f="marks" style="max-width:100px;">
        <input type="number" placeholder="एकूण गुण" value="${r.max}" data-i="${i}" data-f="max" style="max-width:100px;">
      </div>`).join('');
    document.querySelectorAll('#subjRows input').forEach(inp=>{ inp.oninput = ()=>{ examSubjectRows[inp.dataset.i][inp.dataset.f] = inp.value; }; });
  }
  renderSubjRows();
  document.getElementById('addSubjRow').onclick = ()=>{ examSubjectRows.push({name:'',marks:'',max:''}); renderSubjRows(); };
  document.getElementById('cancelExam').onclick = ()=> overlay.remove();
  document.getElementById('saveExam').onclick = async ()=>{
    const name = document.getElementById('examName').value.trim();
    const valid = examSubjectRows.filter(r=>r.name && r.marks!=='' && r.max!=='');
    if(!name || valid.length===0){ alert('परीक्षेचं नाव आणि किमान एक विषय भरा.'); return; }
    s.exams.push({ id:'ex'+Date.now(), name, subjects: valid });
    await saveSchool();
    overlay.remove();
    renderProgressBody();
  };
}

  if(!confirm('हा संपूर्ण वर्ग व त्यातले सगळे विद्यार्थी कायमचे काढायचे आहेत का?')) return;
  school.classes.splice(idx,1);
  if(school.classes.length===0) school.classes.push({id:'cl'+Date.now(), name:'इयत्ता १ ली', students:[], parentMessages:[]});
  saveSchool();
  currentClassIdx = 0;
  render();
}

function renderStudentTabContent(){
  const cls = school.classes[session.classIdx];
  const s = cls.students.find(x=>x.id===session.studentId);

  const attendPane = document.getElementById('pane-myattend');
  if(attendPane){
    const days = Object.keys(s.attendance).sort();
    const totalPresent = days.filter(d=>s.attendance[d]===true).length;
    const overallPct = days.length>0 ? Math.round((totalPresent/days.length)*100) : 0;
    const recent = days.slice(-10).reverse();
    attendPane.innerHTML = `
      <div class="repcard"><p class="rtitle">एकूण हजेरी टक्केवारी</p><p class="rval ${overallPct<75 && days.length>0?'give':'get'}">${days.length>0?overallPct+'%':'नोंद नाही'}</p></div>
      <p style="font-size:13.5px;color:var(--muted);margin:14px 0 8px;">अलीकडचे १० दिवस:</p>
      ${recent.length===0?'<p style="color:var(--muted);font-size:14px;">नोंद नाही.</p>':recent.map(d=>`<div class="lowrow"><span>${displayDate(d)}</span><span class="${s.attendance[d]?'val get':'val give'}" style="font-size:14px;">${s.attendance[d]?'हजर':'गैरहजर'}</span></div>`).join('')}
    `;
  }

  const progPane = document.getElementById('pane-myprogress');
  if(progPane){
    const overallAvg = computeAvg(s);
    progPane.innerHTML = `
      <div class="repcard"><p class="rtitle">एकूण सरासरी टक्केवारी</p><p class="rval ${s.exams.length>0 && overallAvg<40?'give':'get'}">${s.exams.length>0?overallAvg+'%':'परीक्षा नोंद नाही'}</p></div>
      <div class="adminpad"><h4>परीक्षा निकाल</h4>
        ${s.exams.length===0?'<p style="color:var(--muted);font-size:14px;">अजून परीक्षा नोंदलेली नाही.</p>':
          [...s.exams].reverse().map(ex=>{
            const total = ex.subjects.reduce((a,b)=>a+Number(b.marks),0);
            const max = ex.subjects.reduce((a,b)=>a+Number(b.max),0);
            const pct = max>0?Math.round((total/max)*100):0;
            return `<div class="lowrow" style="flex-direction:column;align-items:stretch;"><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;"><span>${ex.name}</span><span class="${pct<40?'val give':'val get'}" style="font-size:15px;">${pct}%</span></div><div style="font-size:12.5px;color:var(--muted);">${ex.subjects.map(sub=>sub.name+': '+sub.marks+'/'+sub.max).join(', ')}</div></div>`;
          }).join('')}
      </div>
      <div class="adminpad"><h4>वर्तणूक व खेळ नोंद</h4><p style="font-size:14.5px;">${s.behavior||'नोंद नाही'}</p><p style="font-size:14.5px;">${s.sports||'नोंद नाही'}</p></div>
    `;
  }

  const feePane = document.getElementById('pane-myfees');
  if(feePane){
    const totalDue = s.fees.filter(f=>!f.paid).reduce((a,b)=>a+Number(b.amount),0);
    feePane.innerHTML = `
      <div class="repcard"><p class="rtitle">एकूण बाकी फी</p><p class="rval ${totalDue>0?'give':'get'}">${fmt(totalDue)}</p></div>
      <div class="adminpad"><h4>फी इतिहास</h4>
        ${s.fees.length===0?'<p style="color:var(--muted);font-size:14px;">अजून नोंद नाही.</p>':
          [...s.fees].reverse().map(f=>`<div class="lowrow"><span>${f.type}</span><span class="tag ${f.paid?'fee-paid':'fee-due'}">${f.paid?'भरली':'बाकी'} ${fmt(f.amount)}</span></div>`).join('')}
      </div>`;
  }

  const noticePane = document.getElementById('pane-mynotice');
  if(noticePane) noticePane.innerHTML = (school.notice && school.notice.active && school.notice.text) ? `<div class="notice"><p>📢 ${school.notice.text}</p></div>` : '<p style="color:var(--muted);font-size:14px;">सध्या कोणतीही सूचना नाही.</p>';

  const evPane = document.getElementById('pane-myevents');
  if(evPane){
    const sortedEv = [...school.events].sort((a,b)=>a.date.localeCompare(b.date));
    evPane.innerHTML = sortedEv.length===0 ? '<p style="color:var(--muted);font-size:14px;">सध्या कोणताही कार्यक्रम नाही.</p>' :
      sortedEv.map(ev=>`<div class="adminpad"><span class="tag event">${displayDate(ev.date)}</span><h4 style="margin:8px 0 4px;">${ev.name}</h4><p style="font-size:13.5px;color:var(--muted);">${ev.desc||''}</p></div>`).join('');
  }

  const pmPane = document.getElementById('pane-myparentmsg');
  if(pmPane){
    const pmMsgs = cls.parentMessages || [];
    pmPane.innerHTML = pmMsgs.length===0 ? '<p style="color:var(--muted);font-size:14px;">अजून कोणताही संदेश आलेला नाही.</p>' :
      [...pmMsgs].reverse().map(m=>`<div class="msgbox"><p class="mtitle">${m.title}</p><p class="mmeta">${displayDate(m.date)}</p><p class="mbody">${m.body}</p></div>`).join('');
  }

  const sendPane = document.getElementById('pane-mysend');
  if(sendPane){
    const mine = school.studentMessages.filter(m=>m.studentId===s.id);
    sendPane.innerHTML = `
      <div class="adminpad">
        <h4>शिक्षकांना संदेश पाठवा</h4>
        <div class="field"><label>प्रकार</label><select id="msgType"><option>रजेची विनंती</option><option>तक्रार</option><option>सूचना</option></select></div>
        <div class="field"><label>तपशील</label><textarea id="msgText" placeholder="इथे तुमचा मजकूर लिहा"></textarea></div>
        <button class="btn primary wide" id="sendMsgBtn">पाठवा</button>
      </div>
      <div class="adminpad"><h4>तुम्ही पाठवलेले आधीचे संदेश</h4>
        ${mine.length===0?'<p style="color:var(--muted);font-size:14px;">अजून काही पाठवलेलं नाही.</p>':
          [...mine].reverse().map(m=>`<div class="msgbox"><p class="mtitle">${m.type}</p><p class="mmeta">${displayDate(m.date)}</p><p class="mbody">${m.text}</p>${m.reply?`<p style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);"><b>शिक्षकांचं उत्तर:</b> ${m.reply}</p>`:'<p style="color:var(--muted);font-size:13px;margin-top:8px;">अजून उत्तर आलेलं नाही.</p>'}</div>`).join('')}
      </div>`;
    document.getElementById('sendMsgBtn').onclick = async ()=>{
      const text = document.getElementById('msgText').value.trim();
      if(!text){ alert('मजकूर टाका'); return; }
      school.studentMessages.push({ id:'sm'+Date.now(), studentId:s.id, studentName:s.name, className: cls.name, type: document.getElementById('msgType').value, text, date: todayStr(), reply:'' });
      await saveSchool();
      renderStudentTabContent();
      alert('संदेश पाठवला!');
    };
  }
}

initApp();
</script>
</body>
</html>
