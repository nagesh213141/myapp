<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>कागदपत्र वॉलेट</title>
<style>
  :root{
    --bg:#f2f5f8; --surface:#ffffff; --surface2:#eeecfc; --line:#dde3ea;
    --dark:#1f2226; --muted:#5f6b78;
    --blue:#4123D0; --blue-dark:#2f1aa0; --blue-bg:#eeecfc;
    --red:#c62828; --red-bg:#fdecea;
    --green:#1e7e34; --green-bg:#e6f4ea;
    --gold:#b8790a; --gold-bg:#fdf1de;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{font-family:'Noto Sans','Segoe UI',sans-serif;background:#dfe6ec;color:var(--dark);font-size:16px;}
  .app{max-width:460px;margin:0 auto;height:calc(100vh - 60px);overflow-y:auto;background:var(--bg);border-style:solid;border-color:var(--blue);border-width:46px 12px 12px 12px;border-radius:18px;-webkit-overflow-scrolling:touch;}
  .topbar{background:var(--blue);padding:18px 20px 20px;border-bottom:3px solid var(--blue-dark);position:relative;color:#fff;}
  .topbar h1{font-size:20px;margin:0;font-weight:700;color:#fff;}
  .topbar p{margin:5px 0 0;font-size:13.5px;color:#dbe9fb;}
  .roletag{position:absolute;top:18px;right:20px;font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:20px;font-weight:700;}
  .menuscroll{display:flex;gap:8px;overflow-x:auto;background:var(--surface);border-bottom:2px solid var(--line);white-space:nowrap;-webkit-overflow-scrolling:touch;padding:10px 12px;}
  .menuscroll::-webkit-scrollbar{display:none;}
  .mitem{flex-shrink:0;padding:7px 12px;color:var(--blue-dark);font-size:12.5px;font-weight:800;cursor:pointer;border:2px solid var(--blue);border-radius:7px;background:var(--blue-bg);}
  .mitem.active{color:#fff;border:2px solid var(--green);background:var(--green);}
  .content{padding:16px;padding-bottom:100px;}
  .classrow{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
  .classrow::-webkit-scrollbar{display:none;}
  .classbtn{flex-shrink:0;padding:7px 12px;border:2px solid var(--blue);border-radius:7px;background:var(--blue-bg);color:var(--blue-dark);font-size:12.5px;font-weight:800;}
  .classbtn.active{border-color:var(--green);color:#fff;background:var(--green);}
  .summary{display:flex;gap:10px;margin-bottom:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;flex:1;text-align:center;}
  .card .lbl{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600;}
  .card .val{font-size:21px;font-weight:800;margin:0;color:var(--dark);}
  .val.give{color:var(--red);} .val.get{color:var(--green);}
  .doc{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;margin-bottom:10px;background:var(--surface);cursor:pointer;}
  .doc .dicon{width:44px;height:44px;border-radius:8px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue);font-weight:800;font-size:18px;background-size:cover;background-position:center;overflow:hidden;}
  .doc-info{flex:1;min-width:0;}
  .doc-name{font-size:16px;font-weight:700;margin:0;color:var(--dark);}
  .doc-sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;}
  .statuslbl{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;}
  .statuslbl.ok{color:var(--green);background:var(--green-bg);}
  .statuslbl.warn{color:var(--red);background:var(--red-bg);}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:16px;line-height:1.6;}
  .fab{position:fixed;bottom:24px;right:calc(50% - 230px + 20px);background:var(--blue);color:#fff;width:60px;height:60px;border-radius:50%;border:none;font-size:30px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  @media(max-width:460px){.fab{right:20px;}}
  .btn{padding:11px 16px;border-radius:7px;border:2px solid transparent;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--blue);color:#fff;border:2px solid var(--blue-dark);}
  .btn.ghost{background:var(--blue-bg);color:var(--blue);border:2px solid var(--blue);}
  .btn.danger{background:var(--red-bg);color:var(--red);border:2px solid var(--red);}
  .btn.wide{width:100%;}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:22px;max-height:85vh;overflow-y:auto;border-top:4px solid var(--blue);}
  .sheet h3{margin:0 0 16px;font-size:20px;font-weight:700;color:var(--dark);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field textarea,.field select{width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--surface);color:var(--dark);}
  .err{color:var(--red);font-size:13.5px;margin-top:-8px;margin-bottom:12px;display:none;font-weight:600;}
  .sheetbtns{display:flex;gap:10px;margin-top:8px;}
  .adminpad{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:16px;margin-bottom:16px;}
  .adminpad h4{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--dark);}
  .adminpad p.hint{font-size:13.5px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
  .helpline{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}
  .lowrow{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:14px;background:var(--surface);gap:10px;}
  .lowrow.danger{border-color:var(--red);background:var(--red-bg);}
  .roleCard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:14px;padding:20px;margin-bottom:16px;text-align:left;cursor:pointer;}
  .roleCard.teal{background:#0f6e40;border-left:5px solid #5fd394;}
  .roleCard.teal h3{color:#ffffff;}
  .roleCard.teal p{color:#d8f5e6;}
  .roleCard.amber{background:#8a5a00;border-left:5px solid #ffca28;}
  .roleCard.amber h3{color:#ffffff;}
  .roleCard.amber p{color:#ffe9bf;}
  .roleCard.blue{background:#2b3f8f;border-left:5px solid #5c7cff;}
  .roleCard.blue h3{color:#ffffff;}
  .roleCard.blue p{color:#dbe3ff;}
  .roleCard h3{margin:0 0 6px;font-size:17px;color:var(--dark);}
  .roleCard p{margin:0;font-size:13.5px;color:var(--muted);}
  .backbtn{background:var(--red-bg);border:2px solid var(--red);color:var(--red);font-size:15px;font-weight:800;margin-bottom:18px;cursor:pointer;padding:10px 18px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;}
  .idcard{background:#f5f8f0;border-radius:12px;border:1px solid #d3dccf;padding:1rem 1.1rem;}
  .idcard .tag{background:var(--blue-bg);color:var(--blue-dark);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;}
  .idcard .navi{width:52px;height:52px;border-radius:8px;background:#f1efe8;display:flex;align-items:center;justify-content:center;color:#888;font-size:26px;}
  .toggle{width:52px;height:30px;border-radius:20px;position:relative;cursor:pointer;flex-shrink:0;}
  .toggle.on{background:var(--green);}
  .toggle.off{background:var(--line);}
  .toggle .knob{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left 0.15s;}
  .toggle.on .knob{left:25px;}
  .toggle.off .knob{left:3px;}
  input[type="checkbox"]{width:20px;height:20px;vertical-align:middle;margin-right:8px;}
  .darkScreen{background:#0d1b2a;min-height:100vh;color:#ffffff;}
  .darkScreen h1{color:#8ea3ff;}
  .darkScreen p{color:#b9c7d4;}
  .darkScreen .field input,.darkScreen .field select{background:#1d3550;border-color:#2f4a63;color:#ffffff;}
  .darkScreen .btn.ghost{background:#1c2a52;color:#8ea3ff;border:2px solid #5c7cff;}
  .darkScreen .roleCard{border-color:#2f4a63;}
  .cropWrap{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto;touch-action:none;}
  .cropWrap img{display:block;max-width:100%;max-height:48vh;width:auto;height:auto;margin:0 auto;}
  .cropBox{position:absolute;border:2px solid var(--blue);box-shadow:0 0 0 2000px rgba(0,0,0,.45);cursor:move;}
  .cropHandle{position:absolute;width:22px;height:22px;background:var(--blue);border:2px solid #fff;border-radius:50%;touch-action:none;}
  .cropHandle.tl{top:-11px;left:-11px;cursor:nwse-resize;}
  .cropHandle.tr{top:-11px;right:-11px;cursor:nesw-resize;}
  .cropHandle.bl{bottom:-11px;left:-11px;cursor:nesw-resize;}
  .cropHandle.br{bottom:-11px;right:-11px;cursor:nwse-resize;}
</style>
</head>

<script>

firebase.initializeApp(firebaseConfig);
const fbDb = firebase.firestore();

window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(key);
      if(v===null) throw new Error('not found: '+key);
      return {key, value:v, shared:false};
    } else {
      const doc = await fbDb.collection('app_data').doc(key).get();
      if(!doc.exists) throw new Error('not found: '+key);
      return {key, value:doc.data().value, shared:true};
    }
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    } else {
      await fbDb.collection('app_data').doc(key).set({value:value});
      return {key, value, shared:true};
    }
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem(key);
    } else {
      await fbDb.collection('app_data').doc(key).delete();
    }
    return {key, deleted:true, shared:!!shared};
  },
  async list(prefix, shared){
    if(!shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(!prefix || k.startsWith(prefix)) keys.push(k); }
      return {keys, prefix, shared:false};
    } else {
      let q = fbDb.collection('app_data');
      const snap = await q.get();
      const keys = [];
      snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return {keys, prefix, shared:true};
    }
  }
};

let demoMode = false;
let demoReturn = null;
let store = { users:{}, agents:{}, directory:[] };
let demoStore = { users:{}, agents:{}, directory:[] };
let session = { role:null };
let currentTab = 'docs';
let currentUserId = null;
let currentFamilyIdx = 0;
let pendingDocImage = null;

function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const MONTHS=['जाने','फेब्रु','मार्च','एप्रिल','मे','जून','जुलै','ऑग','सप्टें','ऑक्टो','नोव्हें','डिसें'];
function displayDate(key){ const [y,m,d]=key.split('-'); return parseInt(d)+' '+MONTHS[parseInt(m)-1]+' '+y; }
function addMonths(dateStr,n){ const d=new Date(dateStr); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function genId(){ return String(Math.floor(1000+Math.random()*9000)); }
function nextDue(u){ return u.cycle==='yearly' ? addMonths(u.lastPaidDate,12) : addMonths(u.lastPaidDate,1); }
function isExpired(u){ if(!u.lastPaidDate) return true; return todayStr() > nextDue(u); }

function curStore(){ return demoMode ? demoStore : store; }
function ensureFeatures(){
  const s = curStore();
  if(!s.features) s.features = { cropEnabled:true, brightnessEnabled:true, straightenEnabled:true };
  if(!s.features.reminderTemplate) s.features.reminderTemplate = 'नमस्कार, आपली कागदपत्र वॉलेट सेवेची मुदत संपली आहे / लवकरच संपणार आहे. कृपया लवकरात लवकर नूतनीकरण करा.';
  if(!s.features.yearlyPrice) s.features.yearlyPrice = 365;
  if(!s.features.monthlyPrice) s.features.monthlyPrice = 49;
}
async function loadCloud(){
  if(demoMode) return;
  try{ const r = await window.storage.get('kw-cloud', true); if(r&&r.value) store = JSON.parse(r.value); }catch(e){}
}
async function saveCloud(){
  if(demoMode){ return; }
  try{ await window.storage.set('kw-cloud', JSON.stringify(store), true); }catch(e){}
}
async function getMyUserId(){ try{ const r = await window.storage.get('kw-my-user', false); if(r&&r.value) return r.value; }catch(e){} return null; }
async function setMyUserId(id){ try{ await window.storage.set('kw-my-user', id, false); }catch(e){} }

async function initApp(){
  demoMode = false;
  await loadCloud();
  const myId = await getMyUserId();
  if(myId && store.users[myId]){
    const u = store.users[myId];
    if(u.active === false){
      document.getElementById('appRoot').innerHTML = `<div class="darkScreen" style="padding:60px 24px;text-align:center;">
        <h1 style="font-size:20px;color:var(--red);">खातं बंद केलेलं आहे</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:12px;">तुमचं खातं ॲडमिन/एजंटने तात्पुरतं बंद केलं आहे. कृपया त्यांच्याशी संपर्क साधा.</p>
      </div>`;
      return;
    }
    currentUserId = myId; session = {role:'user'};
    if(u.pinEnabled){ showPinCheck(u, ()=>renderRoot()); } else { renderRoot(); }
    return;
  }
  showRoleLanding();
}

function showPinCheck(u, onSuccess){
  const root = document.getElementById('appRoot');
  root.innerHTML = `<div class="darkScreen" style="padding:60px 24px;text-align:center;">
    <h1 style="font-size:22px;color:var(--blue);margin:0 0 8px;">PIN टाका</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 24px;">${u.name}</p>
    <div class="field" style="text-align:left;"><input type="password" id="pinCheckInput" maxlength="4" placeholder="४ अंकी PIN" style="text-align:center;font-size:20px;letter-spacing:8px;"></div>
    <button class="btn primary wide" id="pinCheckBtn">प्रवेश करा</button>
    <p class="err" id="pinCheckErr" style="display:none;margin-top:14px;">PIN चुकीचा आहे.</p>
  </div>`;
  document.getElementById('pinCheckBtn').onclick = ()=>{
    if(document.getElementById('pinCheckInput').value === u.pin){ onSuccess(); }
    else document.getElementById('pinCheckErr').style.display='block';
  };
}

function showRoleLanding(){
  const root = document.getElementById('appRoot');
  root.innerHTML = `
  <div class="darkScreen" style="padding:40px 24px;text-align:center;">
    <h1 style="font-size:24px;margin:0 0 6px;color:var(--blue);">कागदपत्र वॉलेट</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 28px;">तुम्ही कोण आहात ते निवडा</p>
    <div class="roleCard teal" id="pickUser"><h3>यूजर</h3><p>तुमची कागदपत्रे साठवा, स्वच्छ करा, शेअर करा.</p></div>
    <div class="roleCard amber" id="pickAgent"><h3>एजंट</h3><p>नवीन यूजर नोंदवा, कमिशन बघा.</p></div>
    <div class="roleCard blue" id="pickAdmin"><h3>ॲडमिन</h3><p>सर्व यूजर, एजंट व वैधता नियंत्रित करा.</p></div>
    <p style="margin:22px 0 10px;font-size:13px;color:var(--muted);">किंवा आधी डेमो बघा (काहीही टाइप न करता):</p>
    <div class="sheetbtns" style="margin-bottom:8px;"><button class="btn ghost small" id="demoUserBtn">यूजर डेमो</button><button class="btn ghost small" id="demoAgentBtn">एजंट डेमो</button></div>
    <button class="btn ghost wide" id="demoAdminBtn">ॲडमिन डेमो बघा</button>
  </div>`;
  document.getElementById('pickUser').onclick = showUserLogin;
  document.getElementById('pickAgent').onclick = showAgentLogin;
  document.getElementById('pickAdmin').onclick = showAdminLogin;
  document.getElementById('demoUserBtn').onclick = ()=> demoAsUser();
  document.getElementById('demoAgentBtn').onclick = ()=> demoAsAgent();
  document.getElementById('demoAdminBtn').onclick = ()=> demoAsAdmin();
}

function showUserLogin(){
  const root = document.getElementById('appRoot');
  root.innerHTML = `<div class="darkScreen" style="padding:50px 24px;text-align:center;">
    <button class="backbtn" id="back1">मागे जा ✕</button>
    <h1 style="font-size:22px;color:var(--blue);">यूजर लॉगिन</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 24px;">ॲडमिन/एजंटने दिलेला यूजर आयडी व पासवर्ड टाका.</p>
    <div class="field" style="text-align:left;"><input type="text" id="userIdIn" placeholder="यूजर आयडी" style="text-align:center;"></div>
    <div class="field" style="text-align:left;"><input type="password" id="userPassIn" placeholder="पासवर्ड" style="text-align:center;"></div>
    <button class="btn primary wide" id="userLoginBtn">प्रवेश करा</button>
    <p class="err" id="userLoginErr" style="display:none;margin-top:14px;">आयडी किंवा पासवर्ड चुकीचा आहे.</p>
  </div>`;
  document.getElementById('back1').onclick = showRoleLanding;
  document.getElementById('userLoginBtn').onclick = async ()=>{
    demoMode = false;
    const uid = document.getElementById('userIdIn').value.trim();
    const pass = document.getElementById('userPassIn').value.trim();
    const found = store.users[uid];
    if(!found || found.password !== pass){ document.getElementById('userLoginErr').style.display='block'; return; }
    if(found.active === false){
      root.innerHTML = `<div class="darkScreen" style="padding:60px 24px;text-align:center;">
        <h1 style="font-size:20px;color:var(--red);">खातं बंद केलेलं आहे</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:12px;">तुमचं खातं ॲडमिन/एजंटने तात्पुरतं बंद केलं आहे. कृपया त्यांच्याशी संपर्क साधा.</p>
      </div>`;
      return;
    }
    currentUserId = found.id;
    await setMyUserId(found.id);
    session = {role:'user'};
    renderRoot();
  };
}
function showAgentLogin(){
  const root = document.getElementById('appRoot');
  root.innerHTML = `<div class="darkScreen" style="padding:50px 24px;text-align:center;">
    <button class="backbtn" id="back2">मागे जा ✕</button>
    <h1 style="font-size:22px;color:var(--blue);">एजंट लॉगिन</h1>
    <div class="field" style="text-align:left;"><input type="text" id="agentIdIn" placeholder="एजंट आयडी" style="text-align:center;"></div>
    <div class="field" style="text-align:left;"><input type="password" id="agentPassIn" placeholder="पासवर्ड" style="text-align:center;"></div>
    <button class="btn primary wide" id="agentLoginBtn">प्रवेश करा</button>
    <p class="err" id="agentErr" style="display:none;margin-top:14px;">आयडी किंवा पासवर्ड चुकीचा आहे.</p>
  </div>`;
  document.getElementById('back2').onclick = showRoleLanding;
  document.getElementById('agentLoginBtn').onclick = ()=>{
    demoMode = false;
    const id = document.getElementById('agentIdIn').value.trim();
    const pass = document.getElementById('agentPassIn').value.trim();
    if(!store.agents[id] || store.agents[id].password !== pass){ document.getElementById('agentErr').style.display='block'; return; }
    session = {role:'agent', agentId:id};
    renderRoot();
  };
}
function showAdminLogin(){
  const root = document.getElementById('appRoot');
  root.innerHTML = `<div class="darkScreen" style="padding:50px 24px;text-align:center;">

function attach(){
  const lb = document.getElementById('logoutBtn');
  if(lb) lb.onclick = async ()=>{
    if(demoReturn){ session=demoReturn; demoReturn=null; renderRoot(); return; }
    if(session.viaSuperAdmin){ session={role:'admin'}; renderRoot(); return; }
    if(!demoMode && session.role==='user'){ try{ await window.storage.delete('kw-my-user', false); }catch(e){} }
    session={role:null}; showRoleLanding();
  };
  document.querySelectorAll('.mitem').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.mitem').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      USER_TABS.forEach(p=>{ document.getElementById('pane-'+p).style.display = (p===currentTab)?'block':'none'; });
      document.getElementById('fabAdd').style.display = currentTab==='docs' ? 'block' : 'none';
      render();
    });
  });

  if(session.role==='user') attachUser();
  if(session.role==='agent') attachAgent();
  if(session.role==='admin') attachAdmin();
}

function attachUser(){
  document.getElementById('fabAdd').onclick = ()=>{ document.querySelectorAll('.mitem').forEach(x=>x.classList.remove('active')); document.querySelector('[data-tab="add"]').classList.add('active'); currentTab='add'; USER_TABS.forEach(p=>{ document.getElementById('pane-'+p).style.display = (p==='add')?'block':'none'; }); document.getElementById('fabAdd').style.display='none'; render(); };
  const u = curStore().users[currentUserId];
  document.getElementById('galleryBtn').onclick = ()=>{ startUpload(); document.getElementById('galleryInput').click(); };
  document.getElementById('cameraBtn').onclick = ()=>{ startUpload(); document.getElementById('cameraInput').click(); };
  document.getElementById('cameraBtn').style.display = u.cameraAllowed ? 'inline-block' : 'none';
  document.getElementById('cameraHint').textContent = u.cameraAllowed ? 'गॅलरीतून निवडा किंवा थेट फोटो काढा.' : 'ॲडमिनने कॅमेरा पर्याय बंद केला आहे — फक्त गॅलरीतून निवडता येईल.';
  document.getElementById('galleryInput').onchange = (e)=> handlePickedFile(e.target.files[0]);
  document.getElementById('cameraInput').onchange = (e)=> handlePickedFile(e.target.files[0]);
  function startUpload(){
    document.getElementById('uploadBtns').style.display = 'none';
    const sel = document.getElementById('newDocFamily');
    sel.innerHTML = u.family.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
  }
  let cropImgEl = null;
  let cropRect = {x:10, y:10, w:80, h:80};
  let cropDrag = null;

  function handlePickedFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const feats = curStore().features;
      if(!feats.cropEnabled){
        goToAdjustStep(ev.target.result);
        return;
      }
      document.getElementById('cropStep').style.display = 'block';
      const wrap = document.getElementById('cropWrap');
      wrap.innerHTML = '';
      cropImgEl = document.createElement('img');
      cropImgEl.src = ev.target.result;
      wrap.appendChild(cropImgEl);
      cropImgEl.onload = function(){
        cropRect = {x:8, y:8, w:84, h:84};
        buildCropBox();
      };
    };
    reader.readAsDataURL(file);
  }

  function buildCropBox(){
    const wrap = document.getElementById('cropWrap');
    let box = wrap.querySelector('.cropBox');
    if(box) box.remove();
    box = document.createElement('div');
    box.className = 'cropBox';
    ['tl','tr','bl','br'].forEach(pos=>{
      const h = document.createElement('div');
      h.className = 'cropHandle '+pos;
      h.dataset.pos = pos;
      box.appendChild(h);
    });
    wrap.appendChild(box);
    updateCropBoxStyle();

    box.querySelectorAll('.cropHandle').forEach(h=>{
      h.addEventListener('pointerdown', (e)=>{
        e.preventDefault(); e.stopPropagation();
        cropDrag = {mode:'resize', pos:h.dataset.pos};
        h.setPointerCapture(e.pointerId);
      });
    });
    box.addEventListener('pointerdown', (e)=>{
      if(e.target.classList.contains('cropHandle')) return;
      e.preventDefault();
      cropDrag = {mode:'move', startX:e.clientX, startY:e.clientY, orig:{...cropRect}};
      box.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', onCropPointerMove);
    wrap.addEventListener('pointerup', ()=>{ cropDrag = null; });
  }

  function onCropPointerMove(e){
    if(!cropDrag) return;
    const wrap = document.getElementById('cropWrap');
    const rect = wrap.getBoundingClientRect();
    const px = ((e.clientX-rect.left)/rect.width)*100;
    const py = ((e.clientY-rect.top)/rect.height)*100;
    if(cropDrag.mode==='resize'){
      if(cropDrag.pos==='tl'){ cropRect.w += cropRect.x-px; cropRect.h += cropRect.y-py; cropRect.x = px; cropRect.y = py; }
      if(cropDrag.pos==='tr'){ cropRect.w = px-cropRect.x; cropRect.h += cropRect.y-py; cropRect.y = py; }
      if(cropDrag.pos==='bl'){ cropRect.w += cropRect.x-px; cropRect.x = px; cropRect.h = py-cropRect.y; }
      if(cropDrag.pos==='br'){ cropRect.w = px-cropRect.x; cropRect.h = py-cropRect.y; }
      cropRect.w = Math.max(10, Math.min(cropRect.w, 100-cropRect.x));
      cropRect.h = Math.max(10, Math.min(cropRect.h, 100-cropRect.y));
      cropRect.x = Math.max(0, Math.min(cropRect.x, 100-10));
      cropRect.y = Math.max(0, Math.min(cropRect.y, 100-10));
    } else if(cropDrag.mode==='move'){
      const dxPct = ((e.clientX-cropDrag.startX)/rect.width)*100;
      const dyPct = ((e.clientY-cropDrag.startY)/rect.height)*100;
      cropRect.x = Math.max(0, Math.min(cropDrag.orig.x+dxPct, 100-cropDrag.orig.w));
      cropRect.y = Math.max(0, Math.min(cropDrag.orig.y+dyPct, 100-cropDrag.orig.h));
    }
    updateCropBoxStyle();
  }
  function updateCropBoxStyle(){
    const wrap = document.getElementById('cropWrap');
    const box = wrap.querySelector('.cropBox');
    if(!box) return;
    box.style.left = cropRect.x+'%';
    box.style.top = cropRect.y+'%';
    box.style.width = cropRect.w+'%';
    box.style.height = cropRect.h+'%';
  }

  document.getElementById('cancelCropBtn').onclick = ()=>{
    document.getElementById('cropStep').style.display = 'none';
    document.getElementById('uploadBtns').style.display = 'flex';
  };
  document.getElementById('confirmCropBtn').onclick = ()=>{
    const nw = cropImgEl.naturalWidth, nh = cropImgEl.naturalHeight;
    const sx = (cropRect.x/100)*nw, sy = (cropRect.y/100)*nh;
    const sw = (cropRect.w/100)*nw, sh = (cropRect.h/100)*nh;
    const canvas = document.createElement('canvas');
    const maxW = 700;
    const outScale = Math.min(1, maxW/sw);
    canvas.width = sw*outScale; canvas.height = sh*outScale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(cropImgEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    document.getElementById('cropStep').style.display = 'none';
    goToAdjustStep(croppedDataUrl);
  };

  function goToAdjustStep(dataUrl){
    const feats = curStore().features;
    if(!feats.brightnessEnabled && !feats.straightenEnabled){
      finalizeImage(dataUrl, 0, 1.08);
      return;
    }
    document.getElementById('adjustStep').style.display = 'block';
    document.getElementById('rotateFieldWrap').style.display = feats.straightenEnabled ? 'block' : 'none';
    document.getElementById('brightFieldWrap').style.display = feats.brightnessEnabled ? 'block' : 'none';
    const rotateSlider = document.getElementById('rotateSlider');
    const brightnessSlider = document.getElementById('brightnessSlider');
    rotateSlider.value = 0;
    brightnessSlider.value = 108;
    document.getElementById('rotateVal').textContent = '0';
    document.getElementById('brightVal').textContent = '108';
    const img = document.getElementById('adjustPreviewImg');
    img.src = dataUrl;
    function updatePreview(){
      const r = feats.straightenEnabled ? rotateSlider.value : 0;
      const b = feats.brightnessEnabled ? brightnessSlider.value : 108;
      img.style.transform = 'rotate('+r+'deg)';
      img.style.filter = 'brightness('+(b/100)+')';
      document.getElementById('rotateVal').textContent = r;
      document.getElementById('brightVal').textContent = b;
    }
    rotateSlider.oninput = updatePreview;
    brightnessSlider.oninput = updatePreview;
    updatePreview();
    document.getElementById('cancelAdjustBtn').onclick = ()=>{
      document.getElementById('adjustStep').style.display = 'none';
      document.getElementById('uploadBtns').style.display = 'flex';
    };
    document.getElementById('confirmAdjustBtn').onclick = ()=>{
      const rDeg = feats.straightenEnabled ? parseInt(rotateSlider.value) : 0;
      const bMul = (feats.brightnessEnabled ? parseInt(brightnessSlider.value) : 108) / 100;
      document.getElementById('adjustStep').style.display = 'none';
      finalizeImage(dataUrl, rDeg, bMul);
    };
  }

  function finalizeImage(dataUrl, rotateDeg, brightnessMul){
    const img = new Image();
    img.onload = function(){
      const rad = rotateDeg*Math.PI/180;
      const absCos = Math.abs(Math.cos(rad)), absSin = Math.abs(Math.sin(rad));
      const newW = img.width*absCos + img.height*absSin;
      const newH = img.width*absSin + img.height*absCos;
      const canvas = document.createElement('canvas');
      canvas.width = newW; canvas.height = newH;
      const ctx = canvas.getContext('2d');
      ctx.translate(newW/2, newH/2);
      ctx.rotate(rad);
      ctx.filter = 'contrast(1.15) brightness('+brightnessMul+') saturate(1.05)';
      ctx.drawImage(img, -img.width/2, -img.height/2);
      pendingDocImage = canvas.toDataURL('image/jpeg', 0.9);
      document.getElementById('uploadStep2').style.display = 'block';
      const box = document.getElementById('previewBox');
      box.innerHTML = '';
      const previewImg = document.createElement('img');
      previewImg.src = pendingDocImage;
      previewImg.style.width = '100%';
      previewImg.style.display = 'block';
      box.appendChild(previewImg);
    };
    img.src = dataUrl;
  }

  document.getElementById('saveDocBtn').onclick = async ()=>{
    const title = document.getElementById('newDocTitle').value.trim();
    if(!title){ alert('शीर्षक टाका'); return; }
    const famIdx = parseInt(document.getElementById('newDocFamily').value);
    u.family[famIdx].documents.push({ id:'d'+Date.now(), title, category: document.getElementById('newDocCat').value, docNumber: document.getElementById('newDocNumber').value.trim(), expiryDate: document.getElementById('newDocExpiry').value, dateAdded: todayStr(), image: pendingDocImage });
    await saveCloud();
    document.getElementById('newDocTitle').value=''; document.getElementById('newDocNumber').value='';
    document.getElementById('newDocExpiry').value='';
    document.getElementById('uploadStep2').style.display='none';
    document.getElementById('uploadBtns').style.display='flex';
    document.getElementById('previewBox').textContent = 'फोटो निवडलेला नाही';
    pendingDocImage = null;
    alert('कागदपत्र स्वच्छ करून जतन झालं!');
    document.querySelector('[data-tab="docs"]').click();
  };
  document.getElementById('addFamBtn').onclick = async ()=>{
    const name = document.getElementById('newFamName').value.trim();
    if(!name) return;
    u.family.push({name, documents:[]});
    await saveCloud();
    document.getElementById('newFamName').value='';
    render();
  };
  document.getElementById('saveNameBtn').onclick = async ()=>{
    u.name = document.getElementById('userNameInput').value.trim() || u.name;
    await saveCloud();
    document.querySelector('.topbar h1').textContent = u.name;
    alert('जतन झालं!');
  };
  document.getElementById('pinLockToggle').checked = !!u.pinEnabled;
  document.getElementById('pinLockToggle').onchange = (e)=>{
    document.getElementById('pinSetWrap').style.display = e.target.checked ? 'block' : 'none';
    document.getElementById('savePinBtn').style.display = e.target.checked ? 'block' : 'none';
    if(!e.target.checked){ u.pinEnabled = false; saveCloud(); }
  };
  document.getElementById('savePinBtn').onclick = async ()=>{
    const pin = document.getElementById('pinValueInput').value.trim();
    if(pin.length!==4 || isNaN(pin)){ alert('कृपया ४ अंकी PIN टाका'); return; }
    u.pin = pin; u.pinEnabled = true;
    await saveCloud();
    alert('PIN सेट झाला!');
  };
  document.getElementById('exportUserDataBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(u,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='kagadpatra-backup-'+u.id+'.json'; a.click();
  };
}

        window.open('https://wa.me/?text='+msg, '_blank');

      <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;">
        <div class="navi">▢</div>
        <div><p style="font-weight:700;margin:0;">${d.title}</p><p style="font-size:13px;color:#666;margin:2px 0 0;">${d.category}</p></div>
      </div>`}
      <table style="width:100%;font-size:13px;">
        <tr><td style="color:#666;padding:5px 0;">दस्तऐवज क्रमांक</td><td style="text-align:right;padding:5px 0;">${d.docNumber||'—'}</td></tr>
        <tr><td style="color:#666;padding:5px 0;">जोडल्याची तारीख</td><td style="text-align:right;padding:5px 0;">${displayDate(d.dateAdded)}</td></tr>
        ${d.expiryDate ? `<tr><td style="color:#666;padding:5px 0;">एक्सपायरी तारीख</td><td style="text-align:right;padding:5px 0;">${displayDate(d.expiryDate)}</td></tr>` : ''}
      </table>
    </div>
    <div class="sheetbtns" style="margin-top:16px;">
      <button class="btn ghost" id="shareWaBtn">WhatsApp शेअर</button>
      <button class="btn ghost" id="downloadPdfBtn">PDF डाउनलोड</button>
    </div>
    <button class="btn danger wide" style="margin-top:10px;" id="closeDocBtn">बंद करा</button>
  `;
  document.getElementById('docDetailOverlay').style.display='flex';
  document.getElementById('closeDocBtn').onclick = ()=> document.getElementById('docDetailOverlay').style.display='none';
  document.getElementById('shareWaBtn').onclick = ()=>{
    const msg = encodeURIComponent(`माझं "${d.title}" (${d.category}) कागदपत्र पाठवत आहे — दस्तऐवज क्रमांक: ${d.docNumber||'—'}.`);
    window.open('https://wa.me/?text='+msg, '_blank');
  };
  document.getElementById('downloadPdfBtn').onclick = ()=> alert('PDF डाउनलोड सुरू (डेमो) — खऱ्या ॲपमध्ये हे फाईल म्हणून सेव्ह होईल.');
}

function renderAgent(){
  const myUsers = Object.values(curStore().users).filter(u=>u.agentId===session.agentId);
  document.getElementById('agentUserCount').textContent = myUsers.length;
  const agent = curStore().agents[session.agentId];
  const thisMonth = todayStr().slice(0,7);
  const paidThisMonth = myUsers.filter(u=> u.lastPaidDate && u.lastPaidDate.slice(0,7)===thisMonth);
  document.getElementById('agentCommission').textContent = '₹'+(paidThisMonth.length*(agent?agent.commissionPerUser:0));

  const soonBox = document.getElementById('expiringSoonBox');
  const soonUsers = myUsers.filter(u=>{
    if(isExpired(u)) return false;
    const daysLeft = Math.floor((new Date(nextDue(u)) - new Date(todayStr()))/86400000);
    return daysLeft <= 7;
  });
  soonBox.innerHTML = `<h4>लवकरच मुदत संपणारे यूजर</h4>` + (soonUsers.length===0 ? '<p style="color:var(--muted);font-size:14px;">सध्या कोणीही नाही.</p>' :
    soonUsers.map(u=>`<div class="lowrow"><span>${u.name}</span><span style="color:var(--gold);font-weight:700;">${displayDate(nextDue(u))}</span></div>`).join(''));

  const list = document.getElementById('agentUserList');
  list.innerHTML = myUsers.length===0 ? '<p style="color:var(--muted);font-size:14px;">अजून यूजर नोंदवलेले नाहीत.</p>' :
    myUsers.map(u=>{
      const exp = isExpired(u);
      const isActive = u.active !== false;
      return `<div class="lowrow ${exp?'danger':''}" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-weight:700;">${u.name} · आयडी: ${u.id}</span>
          <span class="statuslbl ${exp?'warn':'ok'}">${exp?'मुदत संपली':'सक्रिय'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12.5px;font-weight:600;">खातं चालू ठेवा</span>
          <div class="toggle ${isActive?'on':'off'}" data-agentactivetoggle="${u.id}"><div class="knob"></div></div>
        </div>
        ${u.contactPhone?`<button class="btn ghost small" data-agentwamsg="${u.id}">WhatsApp पाठवा</button>`:''}
      </div>`;
    }).join('');
  list.querySelectorAll('[data-agentactivetoggle]').forEach(t=>{
    t.onclick = async ()=>{
      const u = curStore().users[t.dataset.agentactivetoggle];
      u.active = !(u.active !== false);
      await saveCloud();
      renderAgent();
    };
  });
  list.querySelectorAll('[data-agentwamsg]').forEach(btn=>{
    btn.onclick = ()=>{
      const u = curStore().users[btn.dataset.agentwamsg];
      const msg = encodeURIComponent(curStore().features.reminderTemplate + ' (यूजर: ' + u.name + ')');
      window.open('https://wa.me/91'+u.contactPhone.replace(/\D/g,'')+'?text='+msg, '_blank');
    };
  });
}

function renderAdmin(){
  const users = Object.values(curStore().users);
  document.getElementById('adminTotalUsers').textContent = users.length;
  document.getElementById('adminExpiredCount').textContent = users.filter(isExpired).length;
  const anyCameraOff = users.some(u=>!u.cameraAllowed);
  document.getElementById('cameraGlobalToggle').className = 'toggle ' + (anyCameraOff?'off':'on');
  const f = curStore().features;
  document.getElementById('featCropToggle').className = 'toggle ' + (f.cropEnabled?'on':'off');
  document.getElementById('featBrightnessToggle').className = 'toggle ' + (f.brightnessEnabled?'on':'off');
  document.getElementById('featStraightenToggle').className = 'toggle ' + (f.straightenEnabled?'on':'off');
  const activeUsers = users.filter(u=>!isExpired(u));
  const revenue = activeUsers.reduce((sum,u)=> sum + (u.cycle==='yearly'?f.yearlyPrice:f.monthlyPrice), 0);
  document.getElementById('estimatedRevenue').textContent = '₹'+revenue;

  const list = document.getElementById('adminUserList');
  list.innerHTML = users.length===0 ? '<p style="color:var(--muted);font-size:14px;">अजून यूजर नाहीत.</p>' :
    users.map(u=>{
      const exp = isExpired(u);
      const isActive = u.active !== false;
      const agent = u.agentId ? curStore().agents[u.agentId] : null;
      return `<div class="lowrow ${exp?'danger':''}" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-weight:700;"><input type="checkbox" class="userBulkCheck" data-uid="${u.id}" style="width:16px;height:16px;margin-right:8px;">${u.name}</span>
          <span class="statuslbl ${exp?'warn':'ok'}">${exp?'मुदत संपली':'सक्रिय'}</span>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">आयडी: ${u.id} · ${u.contactPhone||"संपर्क नंबर नाही"} · एजंट: ${agent?agent.name:'थेट'} · देय: ${u.lastPaidDate?displayDate(nextDue(u)):'—'}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12.5px;font-weight:600;">खातं चालू ठेवा</span>
          <div class="toggle ${isActive?'on':'off'}" data-activetoggle="${u.id}"><div class="knob"></div></div>
        </div>
        <div class="sheetbtns">
          <button class="btn ghost small" data-markpaid="${u.id}">आज फी भरली</button>
          ${u.contactPhone?`<button class="btn ghost small" data-wamsg="${u.id}">WhatsApp पाठवा</button>`:''}
        </div>
      </div>`;
    }).join('');
  list.querySelectorAll('[data-markpaid]').forEach(btn=>{
    btn.onclick = async ()=>{
      const u = curStore().users[btn.dataset.markpaid];
      u.lastPaidDate = todayStr();
      await saveCloud();
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-activetoggle]').forEach(t=>{
    t.onclick = async ()=>{
      const u = curStore().users[t.dataset.activetoggle];
      u.active = !(u.active !== false);
      await saveCloud();
      renderAdmin();
    };
  });
  list.querySelectorAll('[data-wamsg]').forEach(btn=>{
    btn.onclick = ()=>{
      const u = curStore().users[btn.dataset.wamsg];
      const msg = encodeURIComponent(curStore().features.reminderTemplate + ' (यूजर: ' + u.name + ')');
      window.open('https://wa.me/91'+u.contactPhone.replace(/\D/g,'')+'?text='+msg, '_blank');
    };
  });

  const agentList = document.getElementById('agentManageList');
  const agents = Object.values(curStore().agents);
  agentList.innerHTML = agents.length===0 ? '<p style="color:var(--muted);font-size:14px;">अजून एजंट नाहीत.</p>' :
    agents.map(a=>`<div class="lowrow"><span>${a.name}</span><span style="color:var(--muted);">आयडी: ${a.id}</span></div>`).join('');
}

initApp();
</script>
</body>
</html>
